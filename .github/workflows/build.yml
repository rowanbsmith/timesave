name: Build and publish apt repository

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get install -y build-essential debhelper devscripts reprepro

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b
          mv ../timesave_*.deb ./

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up reprepro conf
        run: |
          mkdir -p gh-pages/conf
          printf 'Origin: Rowan Smith\nLabel: timesave\nCodename: stable\nSuite: stable\nArchitectures: armhf arm64 amd64\nComponents: main\nDescription: timesave apt repository\n' > gh-pages/conf/distributions

      - name: Add package to repo
        run: |
          cd gh-pages
          reprepro includedeb stable ../timesave_*.deb

      - name: Push updated repo
        run: |
          cd gh-pages
          git config user.name "github-actions"
          git config user.email "rowan@smith.gen.nz"
          git add -A
          git commit -m "Publish ${{ github.ref_name }}"
          git push origin gh-pages
